service: gforce-api

# Serverless Framework v4: o esbuild e nativo. Nao instalar serverless-esbuild,
# que e idioma do v3.
frameworkVersion: '4'

package:
  patterns:
    # Binarios nativos entram no zip como node_modules (ver build.esbuild.external)
    - 'node_modules/.prisma/client/**'
    - 'node_modules/sharp/**'
    - 'node_modules/@img/**'
    # Variantes que nunca executam na Lambda (glibc linux-arm64 e a unica
    # usada em runtime) - excluidas depois das inclusoes, pois o ultimo
    # padrao que casa vence. O '/**' e necessario para casar o CONTEUDO do
    # diretorio, nao so o diretorio em si (sem isso, o padrao nao exclui nada).
    #
    # ATENCAO - limite conhecido, nao resolvido por este glob: no Serverless
    # Framework v4.40 (build.esbuild), o pacote de cada dependencia 'external'
    # (aqui, 'sharp') e reinstalado do zero dentro de .serverless/build antes
    # do zip, e essa pasta inteira entra no artefato incondicionalmente,
    # ignorando package.patterns. Rodando `pnpm sls:package` numa maquina
    # macOS, o `pnpm install` dessa reinstalacao usa a mesma
    # pnpm.supportedArchitectures do package.json (que inclui "current") e
    # volta a trazer os binarios darwin para dentro do zip por esse caminho -
    # os padroes abaixo so removem a copia duplicada que vinha do
    # `node_modules/@img/**` incluido aqui em cima. Empacotando a partir de
    # Linux (CI), esse efeito colateral do "current" nao ocorre. Ver
    # docs/aws-migration/DESIGN-cards-6-7-lambda-iac.md, secao "Binarios
    # nativos", para os numeros medidos e a analise completa.
    - '!node_modules/@img/*darwin*/**'
    - '!node_modules/@img/*musl*/**'
    - '!node_modules/.prisma/client/*darwin*'

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap:
      type: linked
      setNodeOptions: true
    external:
      - '@prisma/client'
      - '.prisma/client'
      - sharp

params:
  dev:
    domainName: api-dev.gforcecoach.com
    # O dominio e o certificado ACM sao criacao manual (ver autoDomain: false
    # abaixo). Enquanto nao existirem, o plugin falharia ao mapear a API para um
    # dominio inexistente e derrubaria o deploy inteiro. Com enabled: false a API
    # sobe na URL crua do API Gateway, que basta para validar o ambiente.
    # Ligar de volta depois de criar o dominio: serverless create_domain --stage dev
    domainEnabled: false
    disableDefaultEndpoint: false
    throttleRate: 10
    throttleBurst: 20
  prod:
    domainName: api.gforcecoach.com
    domainEnabled: true
    disableDefaultEndpoint: true
    throttleRate: 100
    throttleBurst: 200

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: us-east-2
  stage: ${opt:stage, 'dev'}
  memorySize: 1024
  timeout: 29 # teto do API Gateway; nao adianta pedir mais
  logRetentionInDays: 14
  versionFunctions: false
  httpApi:
    payload: '2.0'
    cors: false # o Fastify ja responde CORS; dois CORS = header duplicado
    disableDefaultEndpoint: ${param:disableDefaultEndpoint}
  environment:
    # Grupo A - constantes de runtime: consequencia da arquitetura, nao
    # configuracao. Literais, sem SSM.
    #
    # ENABLE_NOTIFICATION_SCHEDULER de proposito NAO entra aqui. src/env.ts
    # tem default true, e job-registry.ts usa essa flag como gate de
    # EXECUCAO do job (nao so do agendador local em node-cron). Fixa-la em
    # 'false' aqui desabilitaria os cronFotosSexta/cronReavaliacao em
    # producao silenciosamente: o EventBridge dispara, a Lambda roda e
    # retorna {"status":"skipped"}, sem erro em lugar nenhum. Ver
    # test/unit/lambda/serverless-config.spec.ts, que le este arquivo e
    # falha se esta linha for reintroduzida.
    NODE_ENV: production
    TRUST_PROXY: 'true' # sem isso o rate-limit ve o IP do API Gateway, nao o do usuario
    NOTIFICATION_TIMEZONE: America/Sao_Paulo
    LOG_LEVEL: info

    # Grupo B - obrigatorias, sem fallback: se o parametro faltar no SSM, o
    # empacotamento falha nomeando exatamente qual. Isso e proposital -
    # falha alta e cedo, em vez de segredo errado (ou vazio) subindo em
    # silencio. Ver docs/aws-migration/SSM-PARAMETERS.md para criar os
    # parametros.
    DATABASE_URL: ${ssm:/gforce/${sls:stage}/DATABASE_URL}
    JWT_SECRET: ${ssm:/gforce/${sls:stage}/JWT_SECRET}
    LEAD_TRACKING_SALT: ${ssm:/gforce/${sls:stage}/LEAD_TRACKING_SALT}
    CLOUDINARY_CLOUD_NAME: ${ssm:/gforce/${sls:stage}/CLOUDINARY_CLOUD_NAME}
    CLOUDINARY_API_KEY: ${ssm:/gforce/${sls:stage}/CLOUDINARY_API_KEY}
    CLOUDINARY_API_SECRET: ${ssm:/gforce/${sls:stage}/CLOUDINARY_API_SECRET}
    CORS_ORIGIN: ${ssm:/gforce/${sls:stage}/CORS_ORIGIN}
    MAX_FILE_SIZE: ${ssm:/gforce/${sls:stage}/MAX_FILE_SIZE}
    SMTP_HOST: ${ssm:/gforce/${sls:stage}/SMTP_HOST}
    SMTP_USER: ${ssm:/gforce/${sls:stage}/SMTP_USER}
    SMTP_PASS: ${ssm:/gforce/${sls:stage}/SMTP_PASS}
    SMTP_FROM_EMAIL: ${ssm:/gforce/${sls:stage}/SMTP_FROM_EMAIL}
    PRIVACY_CONTROLLER_NAME: ${ssm:/gforce/${sls:stage}/PRIVACY_CONTROLLER_NAME}
    PRIVACY_CONTROLLER_DOCUMENT_TYPE: ${ssm:/gforce/${sls:stage}/PRIVACY_CONTROLLER_DOCUMENT_TYPE}
    PRIVACY_CONTROLLER_DOCUMENT: ${ssm:/gforce/${sls:stage}/PRIVACY_CONTROLLER_DOCUMENT}
    PRIVACY_CONTROLLER_ADDRESS: ${ssm:/gforce/${sls:stage}/PRIVACY_CONTROLLER_ADDRESS}
    PRIVACY_CONTACT_EMAIL: ${ssm:/gforce/${sls:stage}/PRIVACY_CONTACT_EMAIL}

    # Grupo C (integracoes opcionais: SMTP_PORT, SMTP_SECURE, SMTP_FROM_NAME,
    # TWILIO_*, USDA_API_KEY, TACO_API_*, YOUTUBE_API_KEY) foi removido
    # daqui de proposito. src/env.ts ja da default seguro as tres primeiras
    # e trata as demais como .optional() sem validador de formato que
    # rejeite ausencia - mas rejeita string vazia. Ausente e valido; ''
    # nao e. Entram quando o servico correspondente for usado (ver
    # docs/aws-migration/SSM-PARAMETERS.md).

plugins:
  - serverless-domain-manager
  - serverless-offline

custom:
  customDomain:
    enabled: ${param:domainEnabled}
    domainName: ${param:domainName}
    basePath: ''
    apiType: http
    # HTTP API usa certificado da propria regiao. A regra "certificado em
    # us-east-1" vale para CloudFront e REST API edge-optimized.
    endpointType: regional
    securityPolicy: tls_1_2
    # Criacao do dominio e do registro DNS acontece no cartao 8, nao aqui.
    createRoute53Record: false
    autoDomain: false

functions:
  api:
    handler: src/lambda.handler
    events:
      - httpApi: '*'

  cronFotosSexta:
    handler: src/lambda-crons.fridayPhotoReminder
    timeout: 300
    events:
      - schedule:
          method: scheduler # AWS::Scheduler::Schedule: aceita timezone
          rate:
            - cron(0 9 ? * FRI *)
          timezone: America/Sao_Paulo

  cronReavaliacao:
    handler: src/lambda-crons.reavaliacaoReminder
    timeout: 300
    events:
      - schedule:
          method: scheduler
          rate:
            - cron(0 8 * * ? *)
          timezone: America/Sao_Paulo

  cronStorageCleanup:
    handler: src/lambda-crons.storageCleanup
    timeout: 300
    events:
      # Intervalo puro: timezone nao significa nada aqui
      - schedule:
          rate:
            - rate(15 minutes)

resources:
  extensions:
    # O Serverless nao expoe throttle para HTTP API; estende-se o stage direto.
    # Compensa parcialmente o @fastify/rate-limit, que em Lambda passa a contar
    # por instancia.
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingRateLimit: ${param:throttleRate}
          ThrottlingBurstLimit: ${param:throttleBurst}
