service: gforce-api

# Serverless Framework v4: o esbuild e nativo. Nao instalar serverless-esbuild,
# que e idioma do v3.
frameworkVersion: '4'

package:
  patterns:
    # Binarios nativos entram no zip como node_modules (ver build.esbuild.external)
    # @prisma/client e o pacote que o codigo importa; .prisma/client e o
    # cliente gerado que ele carrega. Faltando o primeiro, a funcao nem sobe:
    # "Cannot find module '@prisma/client'" antes de qualquer rota.
    - 'node_modules/.prisma/client/**'
    - 'node_modules/sharp/**'
    - 'node_modules/@img/**'
    # Variantes que nunca executam na Lambda (glibc linux-arm64 e a unica
    # usada em runtime) - excluidas depois das inclusoes, pois o ultimo
    # padrao que casa vence. O '/**' e necessario para casar o CONTEUDO do
    # diretorio, nao so o diretorio em si (sem isso, o padrao nao exclui nada).
    #
    # ATENCAO - limite conhecido, nao resolvido por este glob: no Serverless
    # Framework v4.40 (build.esbuild), o pacote de cada dependencia 'external'
    # (aqui, 'sharp') e reinstalado do zero dentro de .serverless/build antes
    # do zip, e essa pasta inteira entra no artefato incondicionalmente,
    # ignorando package.patterns. Rodando `pnpm sls:package` numa maquina
    # macOS, o `pnpm install` dessa reinstalacao usa a mesma
    # pnpm.supportedArchitectures do package.json (que inclui "current") e
    # volta a trazer os binarios darwin para dentro do zip por esse caminho -
    # os padroes abaixo so removem a copia duplicada que vinha do
    # `node_modules/@img/**` incluido aqui em cima. Empacotando a partir de
    # Linux (CI), esse efeito colateral do "current" nao ocorre. Ver
    # docs/aws-migration/DESIGN-cards-6-7-lambda-iac.md, secao "Binarios
    # nativos", para os numeros medidos e a analise completa.
    # O runtime do Prisma traz uma variante por plataforma e um WebAssembly por
    # banco (CockroachDB, MySQL, SQLite, SQL Server): 64MB dos 74MB do pacote,
    # nada disso executado aqui. Em Node com engine 'library' o que carrega e
    # runtime/library.js, com 328KB. Sem estas exclusoes o descompactado passa
    # dos 250MB que a Lambda aceita e o deploy e recusado.
    - '!node_modules/@img/*darwin*/**'
    - '!node_modules/@img/*musl*/**'
    - '!node_modules/.prisma/client/*darwin*'

build:
  esbuild:
    bundle: true
    minify: true
    sourcemap:
      type: linked
      setNodeOptions: true
    external:
      # Só o sharp fica de fora do bundle: e binario nativo, nao sobrevive a
      # bundling. O @prisma/client NAO entra aqui de proposito — marcado como
      # external, o Serverless o reinstala numa pasta isolada que ignora o
      # package.patterns, arrastando junto o CLI do Prisma, o TypeScript e o
      # effect: 279MB descompactados, acima do teto de 250MB da Lambda. Deixando
      # o esbuild empacotar o cliente, sobe so o JavaScript usado; o engine
      # nativo continua indo como arquivo, via package.patterns, e o caminho
      # dele e fixado em PRISMA_QUERY_ENGINE_LIBRARY (bundle nao preserva a
      # heuristica de localizacao do Prisma).
      - sharp

params:
  dev:
    domainName: api-dev.gforcecoach.com
    domainEnabled: true
    # Enquanto dev aponta para o banco de producao, os crons ficam desligados:
    # ligados, disparariam sobre dados reais em paralelo com a producao — aluno
    # recebendo lembrete duas vezes, limpeza de storage apagando arquivo de
    # verdade. A funcao continua existindo e pode ser invocada sob demanda
    # (serverless invoke -f cronStorageCleanup --stage dev); o que fica desligado
    # e so o disparo automatico.
    cronsEnabled: false
    disableDefaultEndpoint: false
    throttleRate: 10
    throttleBurst: 20
  prod:
    domainName: api.gforcecoach.com
    domainEnabled: true
    # Enquanto o Render continua servindo producao, dois agendadores ativos
    # sobre o mesmo banco significam lembrete duplicado na sexta e duas
    # limpezas de storage concorrentes. Ligar no cutover (cartao 11), depois de
    # desligar os crons do Render — nessa ordem.
    cronsEnabled: false
    # Sem dominio proprio, desligar o endpoint padrao deixaria a API sem
    # endereco nenhum. Voltar para true quando o dominio existir.
    disableDefaultEndpoint: false
    throttleRate: 100
    throttleBurst: 200

provider:
  name: aws
  runtime: nodejs22.x
  architecture: arm64
  region: us-east-2
  stage: ${opt:stage, 'dev'}
  memorySize: 1024
  timeout: 29 # teto do API Gateway; nao adianta pedir mais
  logRetentionInDays: 14
  versionFunctions: false
  httpApi:
    payload: '2.0'
    cors: false # o Fastify ja responde CORS; dois CORS = header duplicado
    disableDefaultEndpoint: ${param:disableDefaultEndpoint}
  environment:
    # Grupo A - constantes de runtime: consequencia da arquitetura, nao
    # configuracao. Literais, sem SSM.
    #
    # ENABLE_NOTIFICATION_SCHEDULER de proposito NAO entra aqui. src/env.ts
    # tem default true, e job-registry.ts usa essa flag como gate de
    # EXECUCAO do job (nao so do agendador local em node-cron). Fixa-la em
    # 'false' aqui desabilitaria os cronFotosSexta/cronReavaliacao em
    # producao silenciosamente: o EventBridge dispara, a Lambda roda e
    # retorna {"status":"skipped"}, sem erro em lugar nenhum. Ver
    # test/unit/lambda/serverless-config.spec.ts, que le este arquivo e
    # falha se esta linha for reintroduzida.
    NODE_ENV: production
    TRUST_PROXY: 'true' # sem isso o rate-limit ve o IP do API Gateway, nao o do usuario
    NOTIFICATION_TIMEZONE: America/Sao_Paulo
    LOG_LEVEL: info
    # Com o cliente bundleado, o Prisma perde a referencia de onde esta o engine
    # nativo. /var/task e a raiz do pacote descompactado na Lambda.
    PRISMA_QUERY_ENGINE_LIBRARY: /var/task/node_modules/.prisma/client/libquery_engine-linux-arm64-openssl-3.0.x.so.node

    # Grupo B - obrigatorias, sem fallback: se o parametro faltar no SSM, o
    # empacotamento falha nomeando exatamente qual. Isso e proposital -
    # falha alta e cedo, em vez de segredo errado (ou vazio) subindo em
    # silencio. Ver docs/aws-migration/SSM-PARAMETERS.md para criar os
    # parametros.
    DATABASE_URL: ${ssm:/gforce/${sls:stage}/DATABASE_URL}
    JWT_SECRET: ${ssm:/gforce/${sls:stage}/JWT_SECRET}
    LEAD_TRACKING_SALT: ${ssm:/gforce/${sls:stage}/LEAD_TRACKING_SALT}
    CLOUDINARY_CLOUD_NAME: ${ssm:/gforce/${sls:stage}/CLOUDINARY_CLOUD_NAME}
    CLOUDINARY_API_KEY: ${ssm:/gforce/${sls:stage}/CLOUDINARY_API_KEY}
    CLOUDINARY_API_SECRET: ${ssm:/gforce/${sls:stage}/CLOUDINARY_API_SECRET}
    CORS_ORIGIN: ${ssm:/gforce/${sls:stage}/CORS_ORIGIN}
    MAX_FILE_SIZE: ${ssm:/gforce/${sls:stage}/MAX_FILE_SIZE}
    SMTP_HOST: ${ssm:/gforce/${sls:stage}/SMTP_HOST}
    SMTP_USER: ${ssm:/gforce/${sls:stage}/SMTP_USER}
    SMTP_PASS: ${ssm:/gforce/${sls:stage}/SMTP_PASS}
    SMTP_FROM_EMAIL: ${ssm:/gforce/${sls:stage}/SMTP_FROM_EMAIL}
    PRIVACY_CONTROLLER_NAME: ${ssm:/gforce/${sls:stage}/PRIVACY_CONTROLLER_NAME}
    PRIVACY_CONTROLLER_DOCUMENT_TYPE: ${ssm:/gforce/${sls:stage}/PRIVACY_CONTROLLER_DOCUMENT_TYPE}
    PRIVACY_CONTROLLER_DOCUMENT: ${ssm:/gforce/${sls:stage}/PRIVACY_CONTROLLER_DOCUMENT}
    PRIVACY_CONTROLLER_ADDRESS: ${ssm:/gforce/${sls:stage}/PRIVACY_CONTROLLER_ADDRESS}
    PRIVACY_CONTACT_EMAIL: ${ssm:/gforce/${sls:stage}/PRIVACY_CONTACT_EMAIL}

    # Grupo C (integracoes opcionais: SMTP_PORT, SMTP_SECURE, SMTP_FROM_NAME,
    # TWILIO_*, USDA_API_KEY, TACO_API_*, YOUTUBE_API_KEY) foi removido
    # daqui de proposito. src/env.ts ja da default seguro as tres primeiras
    # e trata as demais como .optional() sem validador de formato que
    # rejeite ausencia - mas rejeita string vazia. Ausente e valido; ''
    # nao e. Entram quando o servico correspondente for usado (ver
    # docs/aws-migration/SSM-PARAMETERS.md).

plugins:
  - serverless-domain-manager
  - serverless-offline

custom:
  customDomain:
    enabled: ${param:domainEnabled}
    domainName: ${param:domainName}
    basePath: ''
    apiType: http
    # HTTP API usa certificado da propria regiao. A regra "certificado em
    # us-east-1" vale para CloudFront e REST API edge-optimized.
    endpointType: regional
    securityPolicy: tls_1_2
    # Criacao do dominio e do registro DNS acontece no cartao 8, nao aqui.
    createRoute53Record: false
    autoDomain: false

functions:
  api:
    handler: src/lambda.handler
    events:
      - httpApi: '*'

  cronFotosSexta:
    handler: src/lambda-crons.fridayPhotoReminder
    timeout: 300
    events:
      - schedule:
          method: scheduler # AWS::Scheduler::Schedule: aceita timezone
          enabled: ${param:cronsEnabled}
          rate:
            - cron(0 9 ? * FRI *)
          timezone: America/Sao_Paulo

  cronReavaliacao:
    handler: src/lambda-crons.reavaliacaoReminder
    timeout: 300
    events:
      - schedule:
          method: scheduler
          enabled: ${param:cronsEnabled}
          rate:
            - cron(0 8 * * ? *)
          timezone: America/Sao_Paulo

  cronStorageCleanup:
    handler: src/lambda-crons.storageCleanup
    timeout: 300
    events:
      # Intervalo puro: timezone nao significa nada aqui
      - schedule:
          enabled: ${param:cronsEnabled}
          rate:
            - rate(15 minutes)

resources:
  Resources:
    # Sem assinante, o topico existe e nao avisa ninguem. A inscricao fica fora
    # do IaC de proposito: e-mail de pessoa nao entra em repositorio. Depois do
    # deploy, uma vez por conta:
    #
    #   aws sns subscribe --profile gforce-prod --region us-east-2 \
    #     --topic-arn <arn-impresso-no-output> \
    #     --protocol email --notification-endpoint voce@exemplo.com
    #
    # A AWS manda um e-mail de confirmacao; sem clicar, nada chega.
    AlarmTopic:
      Type: AWS::SNS::Topic
      Properties:
        TopicName: gforce-api-${sls:stage}-alarms
        DisplayName: gforce-api ${sls:stage}

    # TreatMissingData: notBreaching em todos - ausencia de metrica e ausencia
    # de trafego, nao incidente. Sem isso, um periodo sem requisicao dispara
    # alarme de madrugada.
    Api5xxAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: gforce-api-${sls:stage}-5xx
        AlarmDescription: Respostas 5xx no API Gateway acima do normal
        Namespace: AWS/ApiGateway
        MetricName: 5xx
        Dimensions:
          - Name: ApiId
            Value:
              Ref: HttpApi
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        # 5, e nao 1: erro isolado acontece: o que interessa e a rajada.
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - Ref: AlarmTopic

    ApiErrosAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: gforce-api-${sls:stage}-erros-lambda
        AlarmDescription: Excecoes na funcao HTTP
        Namespace: AWS/Lambda
        MetricName: Errors
        Dimensions:
          - Name: FunctionName
            Value: gforce-api-${sls:stage}-api
        Statistic: Sum
        Period: 300
        EvaluationPeriods: 1
        Threshold: 5
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - Ref: AlarmTopic

    ApiDuracaoAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: gforce-api-${sls:stage}-duracao
        AlarmDescription: p95 de duracao perto do teto de 29s do API Gateway
        Namespace: AWS/Lambda
        MetricName: Duration
        Dimensions:
          - Name: FunctionName
            Value: gforce-api-${sls:stage}-api
        # p95, nao media: a media e puxada para baixo pelo volume de respostas
        # rapidas e esconde a cauda, que e justamente o que vira timeout.
        ExtendedStatistic: p95
        Period: 300
        EvaluationPeriods: 2
        # 15s. A linha de base medida em 2026-08-10 foi p95 de ~200ms, entao
        # isto e ordens de grandeza acima do normal - nao pega cold start.
        Threshold: 15000
        ComparisonOperator: GreaterThanThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - Ref: AlarmTopic

    # Um cron falho nao aparece em nenhuma tela: ninguem esta olhando quando
    # ele roda. Por isso o limiar aqui e 1, e nao 5 - e por isso a janela e de
    # uma hora, ja que dois deles rodam uma vez por dia.
    CronsFalhandoAlarm:
      Type: AWS::CloudWatch::Alarm
      Properties:
        AlarmName: gforce-api-${sls:stage}-crons-falhando
        AlarmDescription: Alguma funcao de cron terminou em erro
        # Sem Namespace/MetricName/Statistic/Period aqui: o CloudWatch recusa
        # um alarme que declare metrica escalar E bloco Metrics ao mesmo tempo.
        # Com Metrics, periodo e estatistica vao dentro de cada MetricStat.
        EvaluationPeriods: 1
        Threshold: 1
        ComparisonOperator: GreaterThanOrEqualToThreshold
        TreatMissingData: notBreaching
        AlarmActions:
          - Ref: AlarmTopic
        Metrics:
          - Id: total
            Expression: fotos + reavaliacao + limpeza
            Label: Erros somados dos tres crons
            ReturnData: true
          - Id: fotos
            ReturnData: false
            MetricStat:
              Metric:
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                  - Name: FunctionName
                    Value: gforce-api-${sls:stage}-cronFotosSexta
              Period: 3600
              Stat: Sum
          - Id: reavaliacao
            ReturnData: false
            MetricStat:
              Metric:
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                  - Name: FunctionName
                    Value: gforce-api-${sls:stage}-cronReavaliacao
              Period: 3600
              Stat: Sum
          - Id: limpeza
            ReturnData: false
            MetricStat:
              Metric:
                Namespace: AWS/Lambda
                MetricName: Errors
                Dimensions:
                  - Name: FunctionName
                    Value: gforce-api-${sls:stage}-cronStorageCleanup
              Period: 3600
              Stat: Sum

  Outputs:
    AlarmTopicArn:
      Description: Topico dos alarmes - inscrever um e-mail aqui apos o deploy
      Value:
        Ref: AlarmTopic

  extensions:
    # O Serverless nao expoe throttle para HTTP API; estende-se o stage direto.
    # Compensa parcialmente o @fastify/rate-limit, que em Lambda passa a contar
    # por instancia.
    HttpApiStage:
      Properties:
        DefaultRouteSettings:
          ThrottlingRateLimit: ${param:throttleRate}
          ThrottlingBurstLimit: ${param:throttleBurst}
